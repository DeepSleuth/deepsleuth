[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsleuth"
version = "1.0.2"
description = "Deepsleuth — read the fine print. Deterministic deep-visibility security scanner for MCP servers (no LLM)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DeepSleuth", email = "338080601+DeepSleuth@users.noreply.github.com" }]
license = "Apache-2.0"
license-files = ["LICENSE*"]
keywords = ["mcp", "security", "scanner", "model-context-protocol", "supply-chain", "prompt-injection", "tool-poisoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Core scanner has NO third-party runtime dependencies — it speaks MCP over stdio
# itself (see deepsleuth/mcpclient) so it runs in externally-managed (PEP 668)
# environments and stays fully deterministic and offline. The Docker sandbox uses
# the `docker` CLI (not a Python package). YAML policy files are supported via a
# built-in flat parser; PyYAML is optional and only enables nested policy files.
dependencies = []

[project.optional-dependencies]
# Optional: richer (nested) YAML policy files. JSON and flat YAML work without it.
yaml = ["PyYAML==6.0.2"]
# Optional: speak MCP via the official SDK instead of the built-in client.
mcp = ["mcp<2"]

[project.urls]
Homepage = "https://github.com/DeepSleuth/deepsleuth-mcp"
Repository = "https://github.com/DeepSleuth/deepsleuth-mcp"
Issues = "https://github.com/DeepSleuth/deepsleuth-mcp/issues"

[project.scripts]
deepsleuth = "deepsleuth.__main__:main"

[tool.setuptools]
packages = [
    "deepsleuth",
    "deepsleuth.analysis",
    "deepsleuth.detectors",
    "deepsleuth.sandbox",
    "deepsleuth.mcpclient",
]
